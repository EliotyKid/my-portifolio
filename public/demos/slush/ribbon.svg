<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" fill="none">
  <defs>
    <filter id="tube" x="-25%" y="-30%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="28" diffuseConstant="1.3" lighting-color="#92c6ff" result="light"><feDistantLight azimuth="235" elevation="45"/></feDiffuseLighting>
      <feComposite in="light" in2="SourceGraphic" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="lit"/>
      <feSpecularLighting in="bump" surfaceScale="20" specularConstant="0.55" specularExponent="16" lighting-color="#b9dcff" result="shine"><feDistantLight azimuth="235" elevation="55"/></feSpecularLighting>
      <feComposite in="shine" in2="SourceAlpha" operator="in" result="clipped"/>
      <feBlend in="lit" in2="clipped" mode="screen" result="surface"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="12" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="in" result="texture"/>
      <feBlend in="surface" in2="texture" mode="soft-light"/>
    </filter>
  </defs>
  <path d="M-150 620C70 650 145 555 140 415C128 183 347 95 481 205C603 306 539 467 410 444C288 423 363 288 516 316L970 426C1243 491 1430 348 1300 160C1217 40 1102 80 1089 174C1077 269 1233 267 1460 311" stroke="#4da2ff" stroke-width="105" stroke-linecap="round" filter="url(#tube)"/>
